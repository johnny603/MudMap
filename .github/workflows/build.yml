name: Build MudMap APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows you to trigger manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Handles the whisper.cpp submodule

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install pmtiles CLI
        run: |
          curl -fsSL -o /tmp/pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf /tmp/pmtiles.tar.gz -C /tmp pmtiles
          chmod +x /tmp/pmtiles
          echo "PMTILES=/tmp/pmtiles" >> $GITHUB_ENV

      - name: Prepare offline assets
        run: bash scripts/prepare-assets.sh

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mudmap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
